<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>RSS Generator - Redirection</title>
  <script>
    // Script de redirection SPA pour GitHub Pages
    // Redirige vers index.html avec le path en paramètre
    const path = window.location.pathname;
    const search = window.location.search;
    const hash = window.location.hash;

    // Stocke le path pour récupération après redirection
    sessionStorage.setItem('redirect', path + search + hash);

    // Redirige vers la racine
    window.location.replace('./');
  </script>
</head>
<body>
  <p>Redirection en cours...</p>
</body>
</html>
