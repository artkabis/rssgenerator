name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'claude/*']
  pull_request:
    branches: [main]

# Permissions globales pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Autoriser un seul déploiement à la fois
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Lint et vérification du code
  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install client dependencies
        run: cd client && npm ci

  # Job 2: Build du serveur
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm ci

      - name: Check server can start
        run: |
          cd server
          timeout 5 npm run dev || true
        env:
          PORT: 3001

  # Job 3: Build du client
  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm ci

      - name: Build client
        run: cd client && npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/dist
          retention-days: 7

  # Job 4: Déploiement de la démo sur GitHub Pages
  deploy-demo:
    name: Deploy Demo
    runs-on: ubuntu-latest
    needs: build-client
    # Déploie sur main ou manuellement
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')) && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: ./dist

      - name: Copy demo data
        run: |
          mkdir -p ./dist/api
          mkdir -p ./dist/rss
          cp demo/data/posts.json ./dist/api/posts.json
          cp demo/data/config.json ./dist/api/config.json
          cp demo/rss/feed.xml ./dist/rss/feed.xml
          # Créer un fichier .nojekyll pour désactiver Jekyll
          touch ./dist/.nojekyll
          # Vérifier la structure
          echo "📁 Structure du dossier dist:"
          ls -la ./dist/
          ls -la ./dist/api/
          ls -la ./dist/rss/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 5: Validation du flux RSS
  validate-rss:
    name: Validate RSS Feed
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Validate RSS XML syntax
        run: |
          # Vérifier que le fichier XML est bien formé
          xmllint --noout demo/rss/feed.xml
          echo "✅ RSS feed XML is valid"

      - name: Check RSS structure
        run: |
          # Vérifier les éléments requis du RSS
          grep -q "<channel>" demo/rss/feed.xml && echo "✅ Channel element found"
          grep -q "<title>" demo/rss/feed.xml && echo "✅ Title element found"
          grep -q "<link>" demo/rss/feed.xml && echo "✅ Link element found"
          grep -q "<description>" demo/rss/feed.xml && echo "✅ Description element found"
          grep -q "<item>" demo/rss/feed.xml && echo "✅ Item elements found"
          echo "✅ RSS structure validation passed"
